[package]
name = "cuztom-signal-core"
version = "0.1.0"
edition = "2021"
description = "Rust service core for Cuztom Signal (presage + libsignal + ringrtc). M1: link + persistence, M4: calls."

[lib]
# rlib for in-workspace examples/tests; staticlib/cdylib for Swift.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Service layer (link-device, chat websocket, groups, attachments, sqlite store).
presage = { git = "https://github.com/whisperfish/presage" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage" }
# WebRTC for voice/video calls (Signal's ringrtc)
ringrtc = { git = "https://github.com/signalapp/ringrtc", features = ["sim"] }
# current_thread runtime + LocalSet worker (presage uses spawn_local, so its
# futures are !Send and must run on one dedicated thread).
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
# presage's provisioning handshake hands us a futures::oneshot::Sender<Url>.
futures = "0.3"
url = "2"
hex = "0.4"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
