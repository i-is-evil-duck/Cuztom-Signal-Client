[package]
name = "cuztom-signal-core"
version = "0.1.0"
edition = "2021"
description = "Rust service core for Cuztom Signal (presage + libsignal + ringrtc). M1: link + persistence, M4: calls."

[lib]
# rlib for in-workspace examples/tests; staticlib/cdylib for Swift.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Service layer (link-device, chat websocket, groups, attachments, sqlite store).
# Upstream: https://github.com/whisperfish/presage @ 33dd1491130793390e356e15a5711f1e6ca14fdb
# Vendored under vendor/presage so the ZK group-credential request can be added;
# see vendor/README.md. Both crates are patched together because
# presage-store-sqlite depends on presage by relative path.
presage = { path = "vendor/presage/presage" }
presage-store-sqlite = { path = "vendor/presage/presage-store-sqlite" }
# libsignal-service for groups_v2 (zkgroup)
libsignal-service = { git = "https://github.com/whisperfish/libsignal-service-rs", rev = "9e6c08b8e6d413391831dc49065e5b05490d6c82", features = ["phonenumber"] }
# WebRTC for voice/video calls (Signal's ringrtc)
ringrtc = { git = "https://github.com/signalapp/ringrtc", rev = "a1d2ffed1de6ac5b22458a3dced8374513cc44f8", features = ["native", "prebuilt_webrtc"] }
rand = "0.8"
# current_thread runtime + LocalSet worker (presage uses spawn_local, so its
# futures are !Send and must run on one dedicated thread).
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
# presage's provisioning handshake hands us a futures::oneshot::Sender<Url>.
futures = "0.3"
url = "2"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
# Already in the graph through presage/libsignal-service; used directly to build
# test fixtures with the same timestamp type the content metadata requires.
chrono = "0.4"
serde_json = "1"
base64 = "0.22"
prost = "0.14"
# Match the SQLCipher-enabled SQLx used by presage-store-sqlite for safe
# plaintext-to-encrypted migration and verification.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
# Already in the graph through presage/libsignal-service, and pinned to the same
# resolved version so the test cannot compile against a different one than the
# request path uses. Needed to assert header behavior that only a real
# `RequestBuilder` can exhibit; see `an_authorization_header_appends_rather_than_replaces`.
reqwest = "0.13"
