name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Check toolchains
        run: |
          test -d "$DEVELOPER_DIR"
          rustc --version
          xcodebuild -version

      - name: Check C ABI parity
        run: rust-core/scripts/check-ffi-parity.sh

      - name: Rust tests and check
        working-directory: rust-core
        run: |
          export PATH="$PWD/scripts:$PATH"
          cargo test --all-targets
          cargo check --all-targets

      - name: Build native release library
        working-directory: rust-core
        run: |
          export PATH="$PWD/scripts:$PATH"
          cargo build --release

      - name: Swift tests against native library
        env:
          CUZTOM_SIGNAL_CORE_PATH: ${{ github.workspace }}/rust-core/target/release/libcuztom_signal_core.dylib
        run: swift test

      - name: Swift release build
        run: swift build -c release --product CuztomSignal
